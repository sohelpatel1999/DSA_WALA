<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switch Prep Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d6b57">
<meta name="apple-mobile-web-app-title" content="Switch Prep">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one narrow study column, sticky date bar on top, tab bar pinned to the bottom like a phone app. */
:root {
  --bg: #eef2ef; --surface: #fbfcfb; --surface-2: #e3e9e5; --ink: #16211d; --muted: #5a6a63; --line: #d2dbd6;
  --accent: #1d6b57; --accent-ink: #ffffff; --accent-soft: #d5e8df;
  --rev: #9a5800; --rev-soft: #f4e5cc;
  --easy: #2b7a3e; --med: #9a5c00; --hard: #ad3027;
  --good: #2b7a3e; --bad: #ad3027;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1f2a26; --ink: #e3ebe7; --muted: #93a59d; --line: #2b3833;
    --accent: #5ec4a3; --accent-ink: #0b1512; --accent-soft: #1b3830;
    --rev: #e8a74c; --rev-soft: #3a2c17;
    --easy: #6fd089; --med: #e8a74c; --hard: #f07d73; --good: #6fd089; --bad: #f07d73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1f2a26; --ink: #e3ebe7; --muted: #93a59d; --line: #2b3833;
  --accent: #5ec4a3; --accent-ink: #0b1512; --accent-soft: #1b3830;
  --rev: #e8a74c; --rev-soft: #3a2c17;
  --easy: #6fd089; --med: #e8a74c; --hard: #f07d73; --good: #6fd089; --bad: #f07d73;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(76px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand b { font-family: var(--f-display); font-size: 15px; letter-spacing: 0.01em; }
.sync { text-decoration: none; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="synced"] i, .sync[data-s="saved"] i { background: var(--good); }
.sync[data-s="error"] i, .sync[data-s="slow"] i { background: var(--rev); }
.datebar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.datebar h1 { flex: 1; min-width: 0; margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 5.5vw, 30px); line-height: 1.1; text-wrap: balance; }
.datebar .sub { display: block; font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--muted); margin-top: 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font-weight: 600; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn[hidden] { display: none !important; }

/* Bottom tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs a { text-decoration: none; color: var(--muted); text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; }
.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Readiness strip */
.ready { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; min-width: 0; }
.meter .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.meter .val { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.meter .val b { font-family: var(--f-display); font-size: 24px; }
.meter .val span { font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.pace { font-size: 12.5px; margin-top: 6px; font-weight: 500; }
.pace.ok { color: var(--good); } .pace.late { color: var(--rev); }

/* Sections */
section.blk { margin-top: 22px; }
.blk-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.blk-h h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 700; }
.blk-h .meta { font-size: 12.5px; color: var(--muted); }
.list { display: grid; gap: 10px; }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 14px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.card.is-done { background: transparent; }
.card.is-done h3 a, .card.is-done h3 span { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.card.rev { border-left: 3px solid var(--rev); }
.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.tag { padding: 1px 8px; border-radius: 99px; background: var(--surface-2); font-weight: 500; }
.tag.d-E, .tag.d-T { color: var(--easy); } .tag.d-M { color: var(--med); } .tag.d-H { color: var(--hard); }
.tag.revt { background: var(--rev-soft); color: var(--rev); font-weight: 600; }
.tag.bonus { background: var(--accent-soft); color: var(--accent); }
.card h3 { margin: 6px 0 8px; font-size: 16px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
.card h3 a { color: var(--ink); text-decoration: none; }
.card h3 a:hover { text-decoration: underline; color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin-bottom: 10px; }
.links a { font-weight: 500; }
.links .hint { color: var(--muted); }
/* Learn page + DSA Visual switch (naye tab) */
.links a.learn { font-weight: 700; color: var(--accent); }
.brand .right { display: inline-flex; align-items: center; gap: 12px; }
.brand .swap { font-size: 12px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); }
.brand .swap:hover { border-color: var(--accent); }
.rm .learn { text-decoration: none; font-size: 12px; margin-left: 4px; }
.daylesson { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--accent); border-radius: var(--r); background: var(--accent-soft); }
.daylesson a { font-weight: 700; text-decoration: none; }
.daylesson span { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="s"] { background: var(--rev-soft); color: var(--rev); }
.seg button[aria-pressed="true"][data-v="d"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"][data-v="p"] { background: var(--surface-2); color: var(--ink); }
.rate { display: flex; flex-wrap: wrap; gap: 6px; }
.rate button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.rate button small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.rate button[data-r="hard"]:hover { border-color: var(--hard); color: var(--hard); }
.rate button[data-r="ok"]:hover { border-color: var(--med); color: var(--med); }
.rate button[data-r="easy"]:hover { border-color: var(--easy); color: var(--easy); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.txt { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 600; font-size: 13px; }
details.qs, details.note { margin-top: 10px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
details.qs ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
details.note textarea { width: 100%; margin-top: 6px; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 14px; }
.savednote { margin: 0 0 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pull { margin-top: 10px; }
.more { font-size: 13px; color: var(--muted); margin-top: 8px; }

/* Day summary line */
.daysum { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.daysum b { color: var(--ink); }

/* Week */
.day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.day.today { border-color: var(--accent); }
.day-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.day-h button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.day-h button:hover { color: var(--accent); }
.day ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.day li { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.day li span.t { min-width: 0; overflow-wrap: anywhere; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); display: inline-block; transform: translateY(-1px); }
.dot.s { border-color: var(--rev); background: var(--rev-soft); }
.dot.d { border-color: var(--accent); background: var(--accent); }
.kind { font-size: 11px; color: var(--muted); font-family: var(--f-mono); flex: none; }

/* Roadmap */
.tier { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.tier + .tier { margin-top: 12px; }
.tier-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.tier-h h2 { margin: 0; font-family: var(--f-display); font-size: 19px; }
.tier p.blurb { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
.lock { margin-top: 8px; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
.tier details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
.tier details summary { font-size: 14px; color: var(--ink); }
.grp { margin-top: 10px; }
.grp h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.rm { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rm li { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: baseline; font-size: 14px; padding: 3px 0; }
.rm li a, .rm li .t { min-width: 0; overflow-wrap: anywhere; color: var(--ink); text-decoration: none; }
.rm li a:hover { color: var(--accent); text-decoration: underline; }
.rm .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
.rm .start { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12px; padding: 2px 8px; cursor: pointer; font-weight: 600; color: var(--accent); }

/* Progress */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.topics { display: grid; gap: 8px; }
.topic { display: grid; grid-template-columns: minmax(0, 11em) 1fr 3.5em; gap: 10px; align-items: center; font-size: 13.5px; }
.topic .bar { margin: 0; }
.topic .n { text-align: right; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 14px; }
.panel p { margin: 0 0 8px; } .panel p:last-child { margin: 0; }
.panel ol, .panel ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.warn { background: var(--bad); border-color: var(--bad); color: #fff; }
.panel textarea { width: 100%; min-height: 90px; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px; font: 12px var(--f-mono); }
.msg { font-size: 13px; color: var(--muted); }

.ready.one { grid-template-columns: 1fr; }
.setup .lead { font-size: 16px; margin: 18px 0 14px; max-width: 60ch; }
.form { display: grid; gap: 10px; }
.form label { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.form .opt { font-weight: 500; color: var(--muted); margin-left: 4px; }
.form input[type=text], .form input[type=date], .form select { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 9px 10px; font: inherit; font-size: 15px; }
.form input:focus, .form select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form .two > div { min-width: 0; }
.form .msg { margin: 0; }
.form label.check { display: flex; gap: 8px; align-items: center; font-size: 14.5px; margin: 4px 0 0; cursor: pointer; }
.form label.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.est { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.est:empty { display: none; }
.est ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.est p { margin: 0 0 6px; } .est p:last-child { margin: 8px 0 0; }
.est-h { font-size: 12px !important; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.est .ok { color: var(--good); font-weight: 600; } .est .late, p.late { color: var(--rev); font-weight: 600; }
.tabs[hidden] { display: none !important; }
@media (max-width: 480px) {
  .form .two { grid-template-columns: 1fr; }
  .ready, .grid2 { grid-template-columns: 1fr; }
  .topic { grid-template-columns: minmax(0, 8.5em) 1fr 3em; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > i { transition: width .3s ease; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b id="brandname">Switch Prep</b><span class="right"><a class="swap" href="learn.html" title="Saare lessons">📖 Lessons</a><a class="swap" href="../index.html#/home" target="_blank" rel="noopener" title="DSA Visual — alag module, alag progress (naye tab me)">DSA Visual ↗</a><a class="sync" id="sync" href="#progress" data-s="local"><i></i><span>Loading…</span></a></span></div>
    <div class="datebar">
      <button class="iconbtn" id="prev" type="button" aria-label="Previous">‹</button>
      <h1 id="title">Today</h1>
      <button class="iconbtn" id="gotoday" type="button">Today</button>
      <button class="iconbtn" id="next" type="button" aria-label="Next">›</button>
    </div>
  </header>
  <main id="main"><p class="empty">Loading your plan…</p></main>
</div>
<nav class="tabs" aria-label="Views"><div class="in">
  <a href="#today" data-view="today">Today</a>
  <a href="#week" data-view="week">Week</a>
  <a href="#roadmap" data-view="roadmap">Roadmap</a>
  <a href="#progress" data-view="progress">Progress</a>
</div></nav>
<script src="lessons/manifest.js"></script>
<script>
/* ===== Plan content ===== */
const LC = s => 'https://leetcode.com/problems/' + s + '/';
const P = (id, tier, topic, title, diff, url, video, extra) => Object.assign({ id, tier, topic, title, diff, url, video, track: 'dsa', kind: 'problem' }, extra || {});

const DSA = [
  /* ---------- Tier 1 · Core ---------- */
  P('a1', 1, 'Arrays & Two Pointers', 'Two Sum', 'E', LC('two-sum')),
  P('a2', 1, 'Arrays & Two Pointers', 'Remove Duplicates from Sorted Array', 'E', LC('remove-duplicates-from-sorted-array')),
  P('a3', 1, 'Arrays & Two Pointers', 'Segregate 0s and 1s', 'E', 'https://www.geeksforgeeks.org/segregate-0s-and-1s-in-an-array-by-traversing-array-once/'),
  P('a4', 1, 'Arrays & Two Pointers', 'Sort Colors', 'M', LC('sort-colors')),
  P('a5', 1, 'Sliding Window', 'Max Consecutive Ones', 'E', LC('max-consecutive-ones')),
  P('a6', 1, 'Sliding Window', 'Max Consecutive Ones III', 'M', LC('max-consecutive-ones-iii')),
  P('a7', 1, 'Arrays & Two Pointers', '3Sum', 'M', LC('3sum')),
  P('a8', 1, 'Arrays & Two Pointers', 'Container With Most Water', 'M', LC('container-with-most-water')),
  P('h1', 1, 'Hashing', 'Contains Duplicate', 'E', LC('contains-duplicate')),
  P('h2', 1, 'Hashing', 'Valid Anagram', 'E', LC('valid-anagram')),
  P('h3', 1, 'Hashing', 'Top K Frequent Elements', 'M', LC('top-k-frequent-elements')),
  P('h4', 1, 'Hashing', 'Subarray Sum Equals K', 'M', LC('subarray-sum-equals-k')),
  P('h5', 2, 'Hashing', 'Longest Consecutive Sequence', 'M', LC('longest-consecutive-sequence')),
  P('g1', 1, 'Greedy', 'Maximum Subarray (Kadane)', 'M', LC('maximum-subarray')),
  P('g2', 1, 'Greedy', 'Best Time to Buy and Sell Stock', 'E', LC('best-time-to-buy-and-sell-stock')),
  P('r1', 1, 'Recursion', 'Print 1 to N using recursion', 'T', null),
  P('r2', 1, 'Recursion', 'Print N to 1 using recursion', 'T', null),
  P('r3', 1, 'Recursion', 'Factorial using recursion', 'T', null),
  P('r4', 1, 'Recursion', 'Length of a String using recursion', 'T', 'https://www.geeksforgeeks.org/program-for-length-of-a-string-using-recursion/'),
  P('r5', 1, 'Recursion', 'Check if a Number is Palindrome', 'T', 'https://www.geeksforgeeks.org/check-if-a-number-is-palindrome/'),
  P('r6', 1, 'Recursion', 'Fibonacci Number', 'E', LC('fibonacci-number')),
  P('r7', 1, 'DP', 'Climbing Stairs', 'E', LC('climbing-stairs'), 'https://youtu.be/Y0lT9Fck7qI'),
  P('r8', 1, 'Recursion', 'Pow(x, n)', 'M', LC('powx-n')),
  P('r9', 2, 'Recursion', 'Generate Parentheses', 'M', LC('generate-parentheses')),
  P('b1', 1, 'Binary Search', 'Binary Search', 'E', LC('binary-search')),
  P('b2', 1, 'Binary Search', 'Lower Bound (Search Insert Position)', 'E', LC('search-insert-position')),
  P('b3', 1, 'Binary Search', 'First and Last Position in Sorted Array', 'M', LC('find-first-and-last-position-of-element-in-sorted-array')),

function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function fd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return fd(d); }
function dow(s) { return pd(s).getDay(); }
function dayDiff(a, b) { return Math.round((pd(b) - pd(a)) / 864e5); }

/* Turn a person's settings into tier dates, phase windows and daily budgets. */
function defaultConfig(today) {
  const start = today;
  const target = addDays(start, 57);
  return { name: '', start, target, faang: true, faangTarget: addDays(target, 31), hWd: 2.5, hWe: 3 };
}
function applyConfig(c) {
  START = c.start; TARGET = c.target; FAANG_ON = !!c.faang;
  END = FAANG_ON ? c.faangTarget : c.target;
  PLAN_DAYS = dayDiff(START, END) + 1;
  SCALE_WD = (c.hWd || 2.5) / 2.5; SCALE_WE = (c.hWe || 3) / 3;
  const span = dayDiff(START, TARGET) + 1;
  const cDays = Math.max(3, Math.min(11, Math.round(span * 0.19)));
  CONSOL_START = addDays(TARGET, -(cDays - 1));
  const w = t => ALL_ITEMS.filter(i => i.tier === t && !i.bonus).reduce((a, i) => a + mins(i), 0);
  const work = dayDiff(START, CONSOL_START);
  TIERS[1].target = addDays(START, Math.max(1, Math.round(work * w(1) / (w(1) + w(2)))) - 1);
  TIERS[2].target = addDays(CONSOL_START, -1);
  TIERS.C.target = TARGET;
  TIERS.C.blurb = 'Revision, mock rounds and buffer. Ready for target companies on ' + fmtD(TARGET) + '.';
  FAANG_START = addDays(TARGET, 1);
  TIERS[3].target = END;
  const fSpan = Math.max(1, dayDiff(FAANG_START, END));
  [4, 6, 13, 20, 26].forEach((k, n) => { BY_ID['y' + (n + 1)].nb = addDays(FAANG_START, Math.round(fSpan * k / 30)); });
  ITEMS = FAANG_ON ? ALL_ITEMS : ALL_ITEMS.filter(i => i.tier !== 3);
  TIER_ORDER = FAANG_ON ? [1, 2, 'C', 3] : [1, 2, 'C'];
}

const MIN = { T: 15, E: 30, M: 60, H: 75 };

function revisable(it) { return it.track === 'dsa' || it.kind !== 'task'; }
function budget(day) {
  const w = dow(day), f = (w === 0 || w === 6) ? SCALE_WE : SCALE_WD;
  const b = baseBudget(w);
  return { dsa: Math.round(b.dsa * f), th: Math.round(b.th * f) };
}
function baseBudget(w) {
  if (w === 0) return { dsa: 70, th: 80 };   // Sunday: LLD slot
  if (w === 6) return { dsa: 100, th: 70 };   // Saturday: HLD slot
  if (w === 2 || w === 4) return { dsa: 65, th: 40 };   // Tue, Thu: lighter
  return { dsa: 120, th: 40 };                          // Mon, Wed, Fri: two problems
}

/* ===== Scheduling ===== */
function itemState(st, id) { return (st.items && st.items[id]) || {}; }
function tier3Unlocked(st) {
  return ITEMS.every(it => it.tier === 3 || it.tier === 'C' || itemState(st, it.id).s === 'd');
}
function notBefore(it, unl) {
  if (it.nb) return it.nb;
  if (it.tier === 'C') return CONSOL_START;
  if (it.tier === 3 && !unl) return FAANG_START;
  return null;
}

/* Lays every unfinished item onto days from `today` forward.
   Missed days need no special handling: unfinished work simply starts again from today. */
function schedule(st, today) {
  const S = id => itemState(st, id);
  const unl = tier3Unlocked(st);
  const days = {}, at = {};
  const pend = { dsa: [], th: [] };
  for (const it of ITEMS) if (S(it.id).s !== 'd' && (!it.bonus || S(it.id).s === 's')) pend[it.track].push(it);
  let remaining = pend.dsa.length + pend.th.length;
  let day = today;
  const LIMIT = addDays(END, 240);
  while (remaining > 0 && day <= LIMIT) {
    const b = budget(day);
    const rec = { dsa: [], th: [] };
    let dsaUsed = 0;
    for (const tr of ['dsa', 'th']) {
      let used = 0;
      const cap = tr === 'th' && day >= CONSOL_START && day <= TARGET ? b.th + Math.max(0, b.dsa - dsaUsed) : b[tr];
      if (day === today) {
        for (const it of ITEMS) {
          if (it.track !== tr) continue;
          const s = S(it.id);
          if (s.s === 'd' && s.done === today) used += mins(it);
        }
        for (const it of pend[tr]) {
          if (S(it.id).s === 's') { rec[tr].push(it.id); at[it.id] = day; used += mins(it); remaining--; }
        }
      }
      let cands = pend[tr].filter(it => !at[it.id] && (() => { const n = notBefore(it, unl); return !n || n <= day; })());
      if (tr === 'th') {
        const w = dow(day);
        const pref = w === 6 ? 'hld' : w === 0 ? 'lld' : null;
        if (pref) {
          const i = cands.length ? cands.findIndex(c => c.kind === pref && c.tier === cands[0].tier) : -1;
          if (i > 0) { const c = cands.splice(i, 1)[0]; cands.unshift(c); }
        } else {
          const other = cands.filter(c => c.kind !== 'hld' && c.kind !== 'lld');
          if (other.length) cands = other;
        }
      }
      for (const it of cands) {
        const m = mins(it);
        if (used === 0 || used + m <= cap + 15) { rec[tr].push(it.id); at[it.id] = day; used += m; remaining--; }
        else break;
      }
      if (tr === 'dsa') dsaUsed = used;
    }
    days[day] = rec;
    day = addDays(day, 1);
  }
  const finish = {};
  for (const t of TIER_ORDER) {
    const list = ITEMS.filter(i => i.tier === t && (!i.bonus || itemState(st, i.id).s));
    let max = null, unscheduled = false;
    for (const it of list) {
      const s = S(it.id);
      const d = s.s === 'd' ? s.done : at[it.id];
      if (!d) { unscheduled = true; continue; }
      if (!max || d > max) max = d;
    }
    finish[t] = unscheduled ? null : max;
  }
  return { days, at, finish, unlocked: unl };
}

  else stage = Math.min(stage + 2, IV.length - 1);
  return { stage, due: addDays(today, IV[stage]) };
}

  let stage = s.stage || 0;
  if (rating === 'hard') stage = 0;
  else if (rating === 'ok') stage = Math.min(stage + 1, IV.length - 1);
  else stage = Math.min(stage + 2, IV.length - 1);
  return IV[stage];
}

  else if (!valid(d) || (d.updated || 0) < (st.updated || 0)) { fileDirty = true; writeFile(); }
  setSync();
}
async function resume() {

  }
  await attach(dirHandle); await syncFromLinked(); render();
}
async function restoreLinked() {
  if (!FS_OK) return;
  const dir = await idbGet('dir');
  if (!dir) { setSync(); return; }
  dirHandle = dir; folderName = dir.name;
  let perm = 'prompt';
  try { perm = await dir.queryPermission({ mode: 'readwrite' }); } catch (e) {}
  if (perm === 'granted') await resume();
  else { fileNeedsPermission = true; setSync(); render(); }
}
async function reconnect() {
  try {
    const perm = await dirHandle.requestPermission({ mode: 'readwrite' });

  } catch (e) { backupMsg = 'The folder could not be reopened. Choose it again.'; await unlink(); }
}
async function chooseFolder() {

  catch (e) { if (e && e.name !== 'AbortError') { backupMsg = 'Could not open that folder.'; render(); } return; }

  await useFolder(dir);
}
async function useFolder(dir) {
  pendingDir = null;
  let d = null, missing = false;
  try { d = await readHandle(await dir.getFileHandle(PROG)); } catch (e) { if (e && e.name === 'NotFoundError') missing = true; else if (e instanceof SyntaxError) d = undefined; else missing = true; }
  if (d === undefined || (d !== null && !valid(d))) { backupMsg = `${PROG} in that folder is damaged, so nothing was loaded or saved there.`; render(); return; }
  if (valid(d) && d.updated !== st.updated) { offerImport(d, 'the progress file in folder ' + dir.name, dir); return; }
  await attach(dir);
  if (valid(d)) { adopt(d); saveLocal(); }
  else { fileDirty = true; await writeFile(); }
  backupMsg = 'Progress now saves in folder ' + dir.name + '.';
  if (missing && st.cfg) backupMsg += ' Created ' + PROG + ' there.';
  route();
}
async function unlink() { fileHandle = null; dirHandle = null; folderName = ''; fileNeedsPermission = false; fileErr = false; await idbSet('dir', null); setSync(); render(); }
function folderNotice() {

    <div class="row"><button class="btn" type="button" data-act="link">Choose again</button><button class="txt" type="button" data-act="usepending">Save there anyway</button></div></div>`;
}

function offerImport(d, source, handle) {
  if (!Object.keys(st.items).length && !st.cfg) { applyImport(d, handle); return; }
  pendingImport = { d, source, handle: handle || null };
  restoreArmed = false; backupMsg = '';
  if (view !== 'progress' && st.cfg) location.hash = 'progress'; else render();
}
async function applyImport(d, handle) {
  if (!d.cfg && st.cfg) d.cfg = st.cfg;
  adopt(d); pendingImport = null; backupMsg = 'Progress loaded.';
  if (handle) await attach(handle);

}

  if (h) { await attach(h); fileDirty = true; await writeFile(); }
  render();
}
function downloadFile() {
  try {
    const blob = new Blob([JSON.stringify(st, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = PROG;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    markFileSave(); backupMsg = FS_OK ? 'Downloaded.' : 'Downloaded. Move it into this planner\'s folder so the two stay together.';

}
function importFromInput(input) {
  const f = input.files && input.files[0]; if (!f) return;
  f.text().then(txt => {
    let d = null; try { d = JSON.parse(txt); } catch (e) {}

window.addEventListener('storage', ev => {

/* ===== Actions ===== */
function setStatus(id, v) {
  const it = BY_ID[id], e = ensure(id);
  if (v === 'd') {
    if (e.s !== 'd') { e.s = 'd'; e.done = TODAY; if (revisable(it)) { e.stage = 0; e.due = addDays(TODAY, 1); } }
  } else {
    if (v === 's') e.s = 's'; else delete e.s;
    delete e.done; delete e.due; delete e.stage;
  }
  persist(); render();
}
function rate(id, r) {
  const e = ensure(id);
  const n = nextReview(e, r, TODAY);
  (e.h || (e.h = [])).push([TODAY, r, e.stage || 0, e.due]);
  e.stage = n.stage; e.due = n.due;
  persist(); render();
}
function undoRate(id) {
  const e = ensure(id); const last = e.h && e.h[e.h.length - 1];
  if (!last || last[0] !== TODAY) return;
  e.h.pop(); e.stage = last[2]; e.due = last[3];
  persist(); render();
}
function pullNext() {
  const days = Object.keys(plan.days).filter(d => d > TODAY).sort();
  for (const d of days) { const id = plan.days[d].dsa[0]; if (id) { ensure(id).s = 's'; persist(); render(); return; } }
}

/* ===== Derived data ===== */
function recompute() { TODAY = todayStr(); plan = schedule(st, TODAY); }
const lastRev = id => { const h = get(id).h; return h && h.length ? h[h.length - 1] : null; };
function revisionsToday() {
  const due = ITEMS.filter(it => { const e = get(it.id); return e.s === 'd' && e.due && e.due <= TODAY; })
    .sort((a, b) => get(a.id).due.localeCompare(get(b.id).due) || TIER_RANK[a.tier] - TIER_RANK[b.tier]);
  const done = ITEMS.filter(it => { const l = lastRev(it.id); return l && l[0] === TODAY; });
  const hasNew = ((plan.days[TODAY] && plan.days[TODAY].dsa.length) || 0) > 0;
  const cap = hasNew ? 4 : 8;
  const room = Math.max(0, cap - done.length);
  return { due: due.slice(0, room), extra: Math.max(0, due.length - room), done, cap };
}
function tierStats(tiers) {
  const list = ITEMS.filter(i => tiers.includes(i.tier) && !i.bonus);
  const tot = list.reduce((a, i) => a + mins(i), 0);
  const dn = list.filter(i => get(i.id).s === 'd').reduce((a, i) => a + mins(i), 0);
  let proj = null, missing = false;
  for (const t of tiers) { const f = plan.finish[t]; if (!f) missing = true; else if (!proj || f > proj) proj = f; }
  return { pct: tot ? Math.round(dn / tot * 100) : 0, proj: missing ? null : proj, allDone: list.every(i => get(i.id).s === 'd') };
}
const fmt = (s, o) => pd(s).toLocaleDateString('en-IN', o || { day: 'numeric', month: 'short' });
function paceLine(stats, target) {
  if (stats.allDone) return '<div class="pace ok">Complete</div>';
  if (!stats.proj) return '<div class="pace late">Not yet scheduled</div>';
  const late = dayDiff(target, stats.proj);
  if (late <= 0) return `<div class="pace ok">On track · est. ${fmt(stats.proj)}</div>`;
  return `<div class="pace late">${late} day${late > 1 ? 's' : ''} behind · est. ${fmt(stats.proj)}</div>`;
}
function meter(label, stats, target) {
  return `<div class="meter"><div class="lbl">${label}</div>
    <div class="val"><b class="mono">${stats.pct}%</b><span>by ${fmt(target)}</span></div>
    <div class="bar"><i style="width:${stats.pct}%"></i></div>${paceLine(stats, target)}</div>`;
}

function meters() {
  return `<div class="ready${FAANG_ON ? '' : ' one'}">${meter('Target companies', tierStats([1, 2, 'C']), TARGET)}${FAANG_ON ? meter('FAANG level', tierStats([3]), END) : ''}</div>`;

/* ===== Card builders ===== */
const hasLesson = it => !!(window.PLAN_MANIFEST && window.PLAN_MANIFEST.files[it.id]);
const learnLink = (it, cls) => hasLesson(it) ? `<a class="${cls || 'learn'}" href="learn.html#${esc(it.id)}" title="Lesson kholo">📖 Learn</a>` : '';

const vizLink = it => hasLesson(it) && it.track === 'dsa' ? `<a class="learn" href="learn.html#${esc(it.id)}/viz" title="Seedha visualizer">▶ Visualize</a>` : '';
const noteP = it => { const n = get(it.id).note; return n ? `<p class="savednote">${esc(n)}</p>` : ''; };

function revCard(it, done) {

/* ===== Views ===== */
function itemsForDay(day) {
  if (day < TODAY) {
    return {
      dsa: ITEMS.filter(i => i.track === 'dsa' && get(i.id).done === day),
      th: ITEMS.filter(i => i.track === 'th' && get(i.id).done === day)
    };
  }
  const p = plan.days[day] || { dsa: [], th: [] };
  const pick = tr => {
    const ids = new Set(p[tr]);
    if (day === TODAY) ITEMS.forEach(i => { if (i.track === tr && get(i.id).done === TODAY) ids.add(i.id); });
    return ITEMS.filter(i => ids.has(i.id));
  };

}
function reviewedOn(day) { return ITEMS.filter(i => (get(i.id).h || []).some(h => h[0] === day)); }

/* Us din ke saare items ek page pe (learn.html Day page). ids = us din ka schedule — din chhoota toh schedule aage shift hota hai, link bhi. */
function dayLessonLink(day, items, revs) {
  if (!items.length && !revs.length) return '';

function viewToday() {

    if (dirHandle && fileNeedsPermission) html += `<div class="lock" style="margin-top:14px"><div class="row"><span>Saving to folder <b>${esc(folderName)}</b> is paused. Your browser asks again after it restarts.</span><button class="btn" type="button" data-act="reconnect">Reconnect folder</button></div></div>`;
    else if (moved) html += `<div class="lock" style="margin-top:14px"><div class="row"><span>This planner was moved, so it stopped saving to its old folder.</span><button class="btn" type="button" data-act="link">Choose its folder</button></div></div>`;
    else if (FS_OK && !fileHandle) html += `<div class="lock" style="margin-top:14px"><div class="row"><span>Keep your progress next to this planner: choose its folder once and every change is saved there.</span><button class="btn" type="button" data-act="link">Choose this planner's folder</button></div></div>${folderNotice()}`;
    else if (!FS_OK && Object.keys(st.items).length && Date.now() - lastFileSave() > 3 * 864e5) html += `<div class="lock" style="margin-top:14px"><div class="row"><span>Your progress is only in this browser. Download it into this planner's folder now and then.</span><button class="btn ghost" type="button" data-act="download">Download progress file</button></div></div>`;

function weekStart(day) { const w = dow(day); return addDays(day, -((w + 6) % 7)); }

function viewRoadmap() {

    };
    const groups = {};
    list.filter(i => i.track === 'dsa').forEach(i => (groups[i.topic] = groups[i.topic] || []).push(i));
    const dsaHtml = Object.keys(groups).map(g => `<div class="grp"><h4>${esc(g)}</h4><ul class="rm">${groups[g].map(row).join('')}</ul></div>`).join('');
    const thList = list.filter(i => i.track === 'th');
    const nD = list.filter(i => i.track === 'dsa').length, nT = thList.length;
    const lockNote = t === 3 && !plan.unlocked ? `<div class="lock">Hidden from your daily list until ${fmt(FAANG_START)}. Finish Tiers 1 and 2 early and it unlocks sooner.</div>` : '';
    const key = 'rm:' + t, open = opened.has(key);
    out += `<div class="tier"><div class="tier-h"><h2>${T.name}</h2><span class="msg mono">${t === 'C' ? fmt(CONSOL_START) + ' – ' + fmt(TARGET) : 'target ' + fmt(T.target)}</span></div>
      <p class="blurb">${T.blurb}</p>
      <div class="bar"><i style="width:${stats.pct}%"></i></div>${paceLine(stats, T.target)}${lockNote}
      <details data-key="${key}"${open ? ' open' : ''}><summary>${nD ? nD + ' problems · ' : ''}${nT} study items</summary>
      ${dsaHtml}${nT ? `<div class="grp"><h4>Java, Spring &amp; design</h4><ul class="rm">${thList.map(row).join('')}</ul></div>` : ''}</details></div>`;
  }
  return out + '</div>';
}

function streak() {
  const act = new Set();
  for (const id in st.items) { const e = st.items[id]; if (e.done) act.add(e.done); (e.h || []).forEach(h => act.add(h[0])); }
  let d = act.has(TODAY) ? TODAY : addDays(TODAY, -1), n = 0;
  while (act.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function viewProgress() {
  const probs = ITEMS.filter(i => i.track === 'dsa' && !i.bonus);
  const solved = probs.filter(i => get(i.id).s === 'd').length;
  const th = ITEMS.filter(i => i.track === 'th');
  const thDone = th.filter(i => get(i.id).s === 'd').length;
  const reviews = Object.values(st.items).reduce((a, e) => a + (e.h ? e.h.length : 0), 0);
  let out = meters();
  out += `<section class="blk"><div class="grid2">
    <div class="stat"><b class="mono">${solved}/${probs.length}</b><span>problems solved</span></div>
    <div class="stat"><b class="mono">${thDone}/${th.length}</b><span>Java, Spring &amp; design items</span></div>
    <div class="stat"><b class="mono">${reviews}</b><span>reviews done</span></div>
    <div class="stat"><b class="mono">${streak()}</b><span>day streak</span></div></div></section>`;
  const topics = [];
  probs.forEach(i => { if (!topics.includes(i.topic)) topics.push(i.topic); });
  out += block('Problems by topic', '', `<div class="panel topics">${topics.map(tp => {
    const l = probs.filter(i => i.topic === tp), dn = l.filter(i => get(i.id).s === 'd').length;
    return `<div class="topic"><span>${esc(tp)}</span><div class="bar"><i style="width:${Math.round(dn / l.length * 100)}%"></i></div><span class="n mono">${dn}/${l.length}</span></div>`;
  }).join('')}</div>`);
  const hard = ITEMS.filter(i => { const l = lastRev(i.id); return l && l[1] === 'hard'; });
  out += block('Rated Hard', hard.length ? hard.length + ' to re-solve' : '', hard.length ? `<div class="panel"><ul class="rm">${hard.map(i => `<li><span class="dot d"></span>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : `<span class="t">${esc(i.title)}</span>`}<span class="when mono">next ${fmt(get(i.id).due)}</span></li>`).join('')}</ul></div>` : '<p class="empty">Problems you rate Hard during review collect here for the re-solve day on ' + fmt(CONSOL_START) + '.</p>');
  out += block('How the plan adapts', '', `<div class="panel"><ul>
    <li>New work is a queue, not fixed dates. Miss a day and it simply starts again tomorrow; the estimates above move to show it.</li>
    <li>Finished items come back for review after 1, 3, 7 and 16 days. Hard resets to 1 day, Easy skips ahead.</li>
    <li>At most 4 reviews a day (8 on days with no new problems), oldest first, so a missed week never becomes a wall.</li>
    <li>Weekdays alternate two problems (Mon, Wed, Fri) and one (Tue, Thu). Saturdays carry a system design problem, Sundays an LLD problem.</li>
    <li>Bonus problems in the Roadmap are never auto-scheduled. Press Start on one when you are ahead.</li></ul></div>`);
  const linkPart = fileHandle && !fileNeedsPermission
    ? `<p>Every change is saved to <b>${esc(PROG)}</b> in folder <b>${esc(folderName)}</b>, next to this planner. To move to another computer, copy the whole folder and choose it there.</p>
       <div class="row"><button class="txt" type="button" data-act="unlink">Stop saving to this folder</button></div>`
    : dirHandle && fileNeedsPermission
      ? `<p>Saving to folder <b>${esc(folderName)}</b> is paused until you allow it again.</p><div class="row"><button class="btn" type="button" data-act="reconnect">Reconnect folder</button><button class="txt" type="button" data-act="unlink">Stop using it</button></div>`
      : FS_OK
        ? `<p>${moved ? 'This planner was moved, so it stopped saving to its old folder. ' : ''}Choose the folder this planner file is in. Every change is then saved there as <b>${esc(PROG)}</b>, so the folder carries your progress.</p>
           <div class="row"><button class="btn" type="button" data-act="link">Choose this planner's folder</button></div>${folderNotice()}`
        : `<p class="msg">This browser cannot save into a folder automatically (Chrome and Edge on a computer can). Download the progress file now and then and keep it in this planner's folder.</p>`;
  const imp = pendingImport ? importBox() : '';
  const c = st.cfg || {};
  out += block('Your plan', '', `<div class="panel">
    <p>Start ${esc(fmt(START, { day: 'numeric', month: 'short', year: 'numeric' }))} · ready for target companies by <b>${esc(fmt(TARGET, { day: 'numeric', month: 'short', year: 'numeric' }))}</b>${FAANG_ON ? ` · FAANG level by <b>${esc(fmt(END, { day: 'numeric', month: 'short', year: 'numeric' }))}</b>` : ''}.</p>
    <p>${esc(c.hWd)} h a day on weekdays, ${esc(c.hWe)} h on weekends.</p>
    <a class="btn ghost" href="#setup" style="display:inline-block;text-decoration:none">Change dates or hours</a>
    <p class="msg" style="margin-top:8px">Your finished problems and notes stay. Only the upcoming days are re-planned.</p></div>`);
  out += block('Save your progress', '', `<div class="panel">
    <p>Progress is also kept in this browser${lsOK ? '' : ' <b>(blocked here, so save a file)</b>'}, but clearing browser data erases that copy.</p>
    ${linkPart}
    <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" data-act="download">Download progress file</button>
      <label class="btn ghost" for="importfile">Load progress file</label><input type="file" id="importfile" accept=".json,application/json" hidden></div>
    <p class="msg" style="margin-top:8px">Last saved to a file: ${esc(stamp(lastFileSave()))}${backupMsg ? ' · ' + esc(backupMsg) : ''}</p>
    ${imp}
    <details class="qs" data-key="paste"${opened.has('paste') || restoreArmed ? ' open' : ''}><summary>Move progress as text (to or from the online version)</summary>
      <p style="margin:8px 0">In the online planner, open Progress and press Copy backup, then paste it here. To go the other way, copy here and paste there.</p>
      <div class="row"><button class="btn ghost" type="button" data-act="copy">Copy backup text</button><span class="msg" id="bmsg"></span></div>
      <textarea id="restore" placeholder="Paste backup text here"></textarea>
      <div class="row"><button class="btn${restoreArmed ? ' warn' : ' ghost'}" type="button" data-act="restore">${restoreArmed ? 'Replace my progress' : 'Load pasted text'}</button>${restoreArmed ? '<button class="txt" type="button" data-act="cancelrestore">Cancel</button><span class="msg">This overwrites everything logged in this browser.</span>' : ''}</div>
    </details></div>`);
  out += block('On your phone', '', `<div class="panel"><p>Phones do not run downloaded HTML files reliably. Use the online planner on your phone, and move progress between the two with the backup text above.</p></div>`);
  return out;
}

function importBox() {
  return `<div class="lock" style="margin-top:12px">
      <p style="margin:0 0 6px"><b>Replace your progress?</b></p>
      <p style="margin:0 0 4px">In ${esc(pendingImport.source)}: <b class="mono">${doneCount(pendingImport.d)}</b> items done, last changed ${esc(stamp(pendingImport.d.updated))}.</p>
      <p style="margin:0 0 8px">In this browser: <b class="mono">${doneCount(st)}</b> items done, last changed ${esc(stamp(st.updated))}.</p>
      <div class="row"><button class="btn warn" type="button" data-act="acceptimport">Use ${pendingImport.handle ? 'the folder\'s progress' : 'the loaded progress'}</button><button class="txt" type="button" data-act="cancelimport">${pendingImport.handle ? "Keep this browser's progress and save it to the folder" : "Keep this browser's progress"}</button></div></div>`;
}

/* ===== Setup ===== */
const HOURS = [1, 1.5, 2, 2.5, 3, 3.5, 4, 5, 6];
function hourOpts(v) { return HOURS.map(h => `<option value="${h}"${h === v ? ' selected' : ''}>${h} h</option>`).join(''); }
function viewSetup() {
  const editing = !!st.cfg;
  const c = st.cfg || defaultConfig(fd(new Date()));
  return `<div class="setup">
    ${editing ? '' : `<p class="lead">A day-by-day plan for a Java backend job switch: about 120 DSA problems, Java and Spring Boot, system design and low-level design, with spaced revision so you remember what you solve. Tell it your dates and it lays out every day for you.</p>`}
    <form id="setupform" class="panel form" novalidate>
      <label for="cf-name">Your name <span class="opt">optional</span></label>
      <input id="cf-name" type="text" autocomplete="given-name" maxlength="40" value="${esc(c.name || '')}" placeholder="Shown at the top of your planner">
      <div class="two">
        <div><label for="cf-start">Start date</label><input id="cf-start" type="date" value="${c.start}" required></div>
        <div><label for="cf-target">Ready for target companies by</label><input id="cf-target" type="date" value="${c.target}" required></div>
      </div>
      <p class="msg">Target companies means typical mid-level product companies: common DSA, strong Java and Spring, basic system design.</p>
      <label class="check"><input id="cf-faang" type="checkbox"${c.faang ? ' checked' : ''}> After that, keep going to FAANG-level prep</label>
      <div id="cf-faangwrap"${c.faang ? '' : ' hidden'}><label for="cf-faangTarget">FAANG-level ready by</label><input id="cf-faangTarget" type="date" value="${c.faangTarget || addDays(c.target, 31)}"></div>
      <div class="two">
        <div><label for="cf-hWd">Study time, Monday to Friday</label><select id="cf-hWd">${hourOpts(c.hWd)}</select></div>
        <div><label for="cf-hWe">Study time, Saturday and Sunday</label><select id="cf-hWe">${hourOpts(c.hWe)}</select></div>
      </div>
      <div id="cf-est" class="est" aria-live="polite"></div>
      <div class="row"><button class="btn" type="submit">${editing ? 'Save changes' : 'Build my plan'}</button>${editing ? '<a class="txt" href="#progress">Cancel</a>' : ''}</div>
    </form>
    ${editing ? '' : `<div class="panel" style="margin-top:12px"><p>Already using this planner? ${FS_OK ? "Choose this planner's folder and the progress saved there loads." : `Load ${PROG} from this planner's folder.`}</p>
      <div class="row">${FS_OK ? '<button class="btn" type="button" data-act="link">Choose this planner\'s folder</button>' : ''}<label class="btn ghost" for="importfile">Load progress file</label></div><input type="file" id="importfile" accept=".json,application/json" hidden>${folderNotice()}${pendingImport ? importBox() : ''}
      ${backupMsg ? `<p class="msg" style="margin-top:8px">${esc(backupMsg)}</p>` : ''}</div>`}
    <p class="msg" style="margin-top:12px">Everything you enter stays in this browser on this device. Nothing is sent anywhere.</p>
  </div>`;
}
function readForm() {
  const v = id => document.getElementById(id);
  return { name: v('cf-name').value.trim(), start: v('cf-start').value, target: v('cf-target').value, faang: v('cf-faang').checked,
    faangTarget: v('cf-faangTarget').value, hWd: Number(v('cf-hWd').value), hWe: Number(v('cf-hWe').value) };
}
function formError(c) {
  if (!c.start || !c.target) return 'Pick a start date and a deadline.';
  if (dayDiff(c.start, c.target) < 14) return 'Leave at least two weeks between the start date and the deadline.';
  if (c.faang && (!c.faangTarget || dayDiff(c.target, c.faangTarget) < 14)) return 'Leave at least two weeks of FAANG prep after the first deadline.';
  return '';
}
function trial(c) {
  applyConfig(c);
  const r = schedule(st, todayStr());
  const mids = [1, 2, 'C'].map(t => r.finish[t]);
  return { core: r.finish[1], mid: mids.includes(null) ? null : mids.sort().pop(), faang: c.faang ? r.finish[3] : null };
}
function estimateHTML(c) {
  const err = formError(c);
  if (err) return `<p class="late">${esc(err)}</p>`;
  const t = trial(c);
  const F = s => s ? fmt(s, { day: 'numeric', month: 'short', year: 'numeric' }) : 'well after your dates';
  const late = t.mid ? dayDiff(c.target, t.mid) : 999;
  let html = `<p class="est-h">At this pace</p><ul>
    <li>Core problems and Java basics done by <b>${F(t.core)}</b>. You can start applying then.</li>
    <li>Ready for target companies by <b>${F(t.mid)}</b> <span class="${late > 0 ? 'late' : 'ok'}">${late > 0 ? `· ${late > 900 ? 'too late' : late + ' days after your deadline'}` : '· on time'}</span></li>`;
  if (c.faang) {
    const fl = t.faang ? dayDiff(c.faangTarget, t.faang) : 999;
    html += `<li>FAANG level by <b>${F(t.faang)}</b> <span class="${fl > 0 ? 'late' : 'ok'}">${fl > 0 ? `· ${fl > 900 ? 'too late' : fl + ' days late'}` : '· on time'}</span></li>`;
  }
  html += '</ul>';
  if (late > 0) {
    let need = null;
    for (const h of HOURS) { if (h <= c.hWd) continue; const t2 = trial(Object.assign({}, c, { hWd: h, hWe: Math.max(c.hWe, h) })); if (t2.mid && t2.mid <= c.target) { need = h; break; } }
    html += `<p class="late">${need ? `To finish on time, try about ${need} h a day, or` : 'Even 6 h a day is not enough here, so'} move the deadline to around ${F(t.mid)}.</p>`;
  }
  if (st.cfg) applyConfig(st.cfg);
  return html;
}
let estTimer = null;
function refreshEstimate() {
  clearTimeout(estTimer);
  estTimer = setTimeout(() => {
    const el = document.getElementById('cf-est'); if (!el) return;
    const c = readForm();
    document.getElementById('cf-faangwrap').hidden = !c.faang;
    el.innerHTML = estimateHTML(c);
  }, 120);
}
function saveSetup() {
  const c = readForm();
  const err = formError(c);
  if (err) { document.getElementById('cf-est').innerHTML = `<p class="late">${esc(err)}</p>`; return; }
  if (!c.faang) c.faangTarget = c.faangTarget || addDays(c.target, 31);
  st.cfg = c; applyConfig(c);
  sel = todayStr();
  persist();
  location.hash = 'today';
  route();
}

/* ===== Render ===== */
function headerFor() {
  const title = document.getElementById('title');
  let main = '', sub = '';
  if (view === 'today') {
    main = fmt(sel, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const n = dayDiff(START, sel) + 1;
    sub = sel < START ? 'Before the plan starts' : n > PLAN_DAYS ? 'After the plan window' : `Day ${n} of ${PLAN_DAYS} · ${TIERS[tierOf(sel)].name}`;
  } else if (view === 'week') {
    const ws = weekStart(sel);
    main = `${fmt(ws)} – ${fmt(addDays(ws, 6))}`; sub = 'Week view · tap a day to open it';
  } else if (view === 'roadmap') { main = 'Roadmap'; sub = fmt(START, { day: 'numeric', month: 'short', year: 'numeric' }) + ' – ' + fmt(END, { day: 'numeric', month: 'short', year: 'numeric' }); }
  else if (view === 'setup') { main = st.cfg ? 'Plan settings' : 'Set up your plan'; sub = st.cfg ? 'Change your dates or study time' : 'Takes under a minute'; }
  else { main = 'Progress'; sub = streak() ? `${streak()} day streak` : 'Every finished item and review counts'; }
  const nm = st.cfg && st.cfg.name;
  document.getElementById('brandname').textContent = nm ? nm + "'s Switch Prep" : 'Switch Prep';
  document.querySelector('.tabs').hidden = view === 'setup';
  title.innerHTML = `${esc(main)}<span class="sub">${esc(sub)}</span>`;
  const nav = view === 'today' || view === 'week';
  document.getElementById('sync').hidden = view === 'setup' && !st.cfg;
  document.getElementById('prev').hidden = !nav;
  document.getElementById('next').hidden = !nav;
  document.getElementById('gotoday').hidden = !(nav && (view === 'week' ? weekStart(sel) !== weekStart(TODAY) : sel !== TODAY));
  document.querySelectorAll('.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view === view ? 'page' : 'false'));
}
function render() {
  const ae = document.activeElement;
  if (ae && ae.tagName === 'TEXTAREA' && ae.dataset.note) { pendingRender = true; return; }
  pendingRender = false;
  const m = document.getElementById('main');
  if (view === 'setup') { headerFor(); m.innerHTML = viewSetup(); refreshEstimate(); return; }
  recompute();
  headerFor();
  m.innerHTML = view === 'week' ? viewWeek() : view === 'roadmap' ? viewRoadmap() : view === 'progress' ? viewProgress() : viewToday();
}

/* ===== Events ===== */
const main = document.getElementById('main');
main.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'status') setStatus(id, b.dataset.v);
  else if (a === 'rate') rate(id, b.dataset.r);
  else if (a === 'undo') undoRate(id);
  else if (a === 'pull') pullNext();
  else if (a === 'open') { sel = b.dataset.day; location.hash = 'today'; if (view === 'today') render(); }
  else if (a === 'copy') {
    const text = JSON.stringify(st);
    const done = msg => { const el = document.getElementById('bmsg'); if (el) el.textContent = msg; };
    try {
      navigator.clipboard.writeText(text).then(() => done('Copied. Paste it into a note or email to yourself.'), () => { const t = document.getElementById('restore'); t.value = text; t.select(); done('Copy blocked here. The backup is selected in the box below.'); });
    } catch (e) { const t = document.getElementById('restore'); t.value = text; t.select(); done('The backup is selected in the box below.'); }
  }
  else if (a === 'restore') {
    const raw = document.getElementById('restore').value.trim();
    let d = null; try { d = JSON.parse(raw); } catch (e) {}
    if (!d || !d.items) { backupMsg = 'That text is not a valid backup.'; restoreArmed = false; render(); return; }
    if (!restoreArmed) { restoreArmed = true; const keep = raw; render(); document.getElementById('restore').value = keep; return; }
    restoreArmed = false; applyImport(d, null);
  }
  else if (a === 'cancelrestore') { restoreArmed = false; render(); }
  else if (a === 'download') downloadFile();
  else if (a === 'link') chooseFolder();
  else if (a === 'usepending') { if (pendingDir) useFolder(pendingDir); }
  else if (a === 'reconnect') reconnect();
  else if (a === 'unlink') unlink();
  else if (a === 'acceptimport') { if (pendingImport) applyImport(pendingImport.d, pendingImport.handle); }
  else if (a === 'cancelimport') keepMine();
});
main.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.dataset || !d.dataset.key) return;
  if (d.open) { opened.add(d.dataset.key); closed.delete(d.dataset.key); } else { closed.add(d.dataset.key); opened.delete(d.dataset.key); }
}, true);
main.addEventListener('change', ev => { if (ev.target.id === 'importfile') importFromInput(ev.target); else if (ev.target.id && ev.target.id.startsWith('cf-')) refreshEstimate(); });
main.addEventListener('submit', ev => { if (ev.target.id === 'setupform') { ev.preventDefault(); saveSetup(); } });
let nTimer = null;
main.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id && t.id.startsWith('cf-') && t.type === 'date') refreshEstimate(); if (!t.dataset || !t.dataset.note) return;
  const v = t.value.trim();
  const e = ensure(t.dataset.note);
  if (v) e.note = t.value; else delete e.note;
  clearTimeout(nTimer); nTimer = setTimeout(persist, 700);
});
main.addEventListener('focusout', ev => {
  if (ev.target.dataset && ev.target.dataset.note) { clearTimeout(nTimer); persist(); setTimeout(() => { if (pendingRender) render(); }, 0); }
});
document.getElementById('prev').onclick = () => { sel = addDays(sel, view === 'week' ? -7 : -1); render(); };
document.getElementById('next').onclick = () => { sel = addDays(sel, view === 'week' ? 7 : 1); render(); };
document.getElementById('gotoday').onclick = () => { sel = TODAY; try { sessionStorage.removeItem(SEL_KEY); } catch (e) {} render(); };
const VIEWS = ['today', 'week', 'roadmap', 'progress', 'setup'];
function route() { const h = location.hash.replace('#', ''); view = !st.cfg ? 'setup' : VIEWS.includes(h) ? h : 'today'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
setInterval(() => { if (st.cfg && todayStr() !== TODAY) { const wasToday = sel === TODAY; recompute(); if (wasToday) sel = TODAY; render(); } }, 60000);

loadLocal();
TODAY = todayStr(); sel = savedSel() || TODAY;   // lesson se wapas aaye toh wahi din (config load ke BAAD — START yahin set hota hai)
route();
setSync();
restoreLinked();
</script>
</body>
